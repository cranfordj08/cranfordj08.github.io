<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tile Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Quicksand', serif; background: #fff5e8; color: #1a1a1a; height: 100vh; display: flex; flex-direction: column; overflow: hidden; background-image: url('bg.png'); background-size:150px auto; background-repeat:repeat-y; background-position: top left; }
h1 { display: inline-block; font-size: 4em; padding: 1em 1em 20px 1em; margin-left: 150px; position: relative; z-index: 1; background-color: #f8f6e5; color: #af2a39; font-family: 'Gochi Hand', cursive; }
.heading-wrapper { position: relative;}
/* .heading-wrapper::after { content: ""; display: block; width: 100%; height: 4px; background-color: #923e3e; position: absolute; top: 50%;left: 100%; transform: translateY(-50%); z-index: 0; } */
.grid { display: flex; justify-content: center; align-items: center; flex-grow: 1; }
.tile { display: block; width: 300px; padding: 2em; /*background-color: #7fa3b3;*/background-color: #af2a39; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-decoration: none; color: #f5b5be; transition: 0.2s ease;}
.tile:hover { transform: translateY(-4px) scale(1.008); box-shadow: 0 8px 12px rgba(0,0,0,0.2); }
</style>
</head>
<body>

<div class="heading-wrapper">
    <h1>Useful Tools</h1>
</div>

<div class="grid">
    <a href="tile-designer.html" class="tile">
        <h2>Tile Designer</h2>
        <p>Design your own tiles with our intuitive editor.</p>
    </a>
</div>

</body>
</html>
